<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博客后台管理</title>
  <style>
    :root { --primary: #2563eb; --text: #1e293b; --border: #e2e8f0; --bg: #f8fafc; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 8px; border: 1px solid var(--border); }
    h1 { font-size: 20px; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
    input[type="text"], input[type="password"], textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
    textarea { height: 260px; font-family: monospace; resize: vertical; }
    button { padding: 8px 16px; background: var(--primary); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    button.danger { background: #ef4444; }
    button.secondary { background: #f1f5f9; color: var(--text); border: 1px solid var(--border); }
    .post-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    .post-table th, .post-table td { padding: 10px; border-bottom: 1px solid var(--border); text-align: left; font-size: 14px; }
    .post-table th { background: #f8fafc; }
    #editor-modal { display: none; margin-bottom: 24px; padding: 20px; background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      <span>博客管理后台</span>
      <a href="/" style="font-size: 14px; color: var(--primary); text-decoration: none;">返回前台</a>
    </h1>

    <div style="margin-bottom: 20px; display: flex; gap: 8px;">
      <input type="password" id="admin-pass" placeholder="输入管理员密码" style="max-width: 300px; margin-bottom: 0;">
      <button onclick="savePass()">保存密码</button>
      <button class="secondary" onclick="openEditor()">+ 发布新文章</button>
    </div>

    <div id="editor-modal">
      <h3 id="modal-title" style="margin-bottom: 12px;">写文章</h3>
      <input type="hidden" id="post-id">
      <input type="text" id="post-title" placeholder="文章标题">
      <input type="text" id="post-tags" placeholder="标签 (多个用逗号隔开，如: 技术, 随笔)">
      <textarea id="post-content" placeholder="输入 Markdown 格式的文章内容..."></textarea>
      <div style="display: flex; gap: 8px;">
        <button onclick="submitPost()">保存并发布</button>
        <button class="secondary" onclick="closeEditor()">取消</button>
      </div>
    </div>

    <table class="post-table">
      <thead>
        <tr>
          <th>标题</th>
          <th>标签</th>
          <th>发布时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="4" style="text-align: center;">加载中...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    let adminPass = localStorage.getItem('blog_admin_pass') || '';
    if (adminPass) document.getElementById('admin-pass').value = adminPass;

    function savePass() {
      adminPass = document.getElementById('admin-pass').value.trim();
      localStorage.setItem('blog_admin_pass', adminPass);
      alert('管理密码已保存！');
      loadAdminPosts();
    }

    async function loadAdminPosts() {
      const tbody = document.getElementById('table-body');
      try {
        const res = await fetch('/api/posts');
        const list = await res.json();
        if (!list || list.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">暂无文章</td></tr>';
          return;
        }
        tbody.innerHTML = list.map(p => `
          <tr>
            <td><strong>${p.title}</strong></td>
            <td>${p.tags || '-'}</td>
            <td>${new Date(p.created_at).toLocaleDateString()}</td>
            <td>
              <button class="danger" style="padding: 4px 8px; font-size: 12px;" onclick="deletePost('${p.id}')">删除</button>
            </td>
          </tr>
        `).join('');
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">加载失败: ' + e.message + '</td></tr>';
      }
    }

    function openEditor() {
      document.getElementById('editor-modal').style.display = 'block';
      document.getElementById('post-id').value = '';
      document.getElementById('post-title').value = '';
      document.getElementById('post-tags').value = '';
      document.getElementById('post-content').value = '';
    }

    function closeEditor() {
      document.getElementById('editor-modal').style.display = 'none';
    }

    async function submitPost() {
      const title = document.getElementById('post-title').value.trim();
      const tags = document.getElementById('post-tags').value.trim();
      const content = document.getElementById('post-content').value.trim();

      if (!title || !content) {
        alert('请填写标题和内容');
        return;
      }

      try {
        const res = await fetch('/api/posts', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': adminPass
          },
          body: JSON.stringify({ title, tags, content })
        });

        if (res.ok) {
          alert('发布成功！');
          closeEditor();
          loadAdminPosts();
        } else {
          alert('发布失败，请检查密码是否正确');
        }
      } catch (e) {
        alert('提交出错: ' + e.message);
      }
    }

    async function deletePost(id) {
      if (!confirm('确认删除该文章？')) return;
      try {
        const res = await fetch(`/api/posts?id=${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': adminPass }
        });
        if (res.ok) {
          loadAdminPosts();
        } else {
          alert('删除失败，请检查密码');
        }
      } catch (e) {
        alert('删除出错: ' + e.message);
      }
    }

    loadAdminPosts();
  </script>
</body>
</html>
